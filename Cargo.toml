[package]
name = "ntfy-windows-client"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "A resource-efficient native ntfy client for Windows"
license = "MIT"
repository = "https://github.com/manilka-gl/ntfy-windows-client"
readme = "README.md"
publish = false
build = "build.rs"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
    "system-tray",
    "unstable-winit-030",
] }
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dev]
debug = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
