name: Active branch verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: active-branch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clippy:
    if: github.head_ref == 'work/ntfy-rebuild'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
