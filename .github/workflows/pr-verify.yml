name: Active branch verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: active-branch-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.head_ref == 'work/ntfy-rebuild'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-features
      - name: Optimized x64 build
        run: cargo build --locked --release
      - name: Visible and background smoke samples
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/release/ntfy-windows-client.exe").Path
          function Measure-Ntfy([string[]]$Arguments, [string]$Mode) {
            $process = Start-Process -FilePath $exe -ArgumentList $Arguments -PassThru
            Start-Sleep -Seconds 2
            $process.Refresh()
            $sample = [ordered]@{
              mode = $Mode
              working_set_bytes = [int64]$process.WorkingSet64
              private_memory_bytes = [int64]$process.PrivateMemorySize64
              cpu_seconds = [double]$process.TotalProcessorTime.TotalSeconds
            }
            Wait-Process -Id $process.Id -Timeout 15
            return $sample
          }
          $metrics = [ordered]@{
            visible = Measure-Ntfy -Arguments @("--smoke-test") -Mode "visible"
            background = Measure-Ntfy -Arguments @("--background", "--smoke-test") -Mode "background"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $metrics | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 dist/perf-metrics.json
          Copy-Item $exe dist/ntfy-windows-client-x64.exe
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Get-Content dist/perf-metrics.json
          Compress-Archive -Path dist/* -DestinationPath ntfy-windows-client-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ntfy-windows-client-x64
          path: ntfy-windows-client-x64.zip
          if-no-files-found: error
