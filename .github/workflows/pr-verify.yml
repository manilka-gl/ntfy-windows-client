name: Active branch verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: active-branch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clippy:
    if: github.head_ref == 'work/ntfy-rebuild'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Normalize sources and lockfile
        shell: pwsh
        run: |
          cargo generate-lockfile
          cargo fmt --all
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock src
            git commit -m "Normalize Rust sources and dependency lock"
            git push
          }
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
