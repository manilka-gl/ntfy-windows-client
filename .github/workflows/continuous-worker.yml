name: Continuous Windows command worker
run-name: >-
  Continuous worker — ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}

on:
  # Manual start. The workflow definition is loaded from the selected ref,
  # normally main, while the branch input identifies the branch to monitor.
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to monitor
        required: true
        type: string

  # Automatic start. Create or update this marker on any branch, including
  # main. The pushed branch itself becomes the monitored branch.
  push:
    branches:
      - '**'
    paths:
      - '.continuous-worker/start.txt'

# Input commands inherit the repository GITHUB_TOKEN with every available
# repository permission set to write. GitHub branch protection and organisation
# policy still apply, including when WATCH_BRANCH is main.
permissions: write-all

# One chain per monitored branch. Different branches run independently.
concurrency:
  group: >-
    continuous-windows-worker-${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: windows-latest

    # The hosted-runner limit is six hours. The watcher ends earlier so the
    # replacement dispatch and cache upload have time to complete.
    timeout-minutes: 350

    env:
      GH_TOKEN: ${{ github.token }}
      WATCH_BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
      CONTROL_BRANCH: ${{ github.event.repository.default_branch }}
      CARGO_CACHE_KEY: >-
        continuous-cargo-Windows-${{ github.event_name == 'push' && github.ref_name || inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # The workflow and watcher are controlled from the default branch.
      - name: Check out worker control files
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          path: .worker-control
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          clean: false
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      # Manual dispatch can reference a branch that was never pushed, and an
      # unrestricted command can delete its own watched ref. Recreate a missing
      # branch from the default branch so checkout and replacement can proceed.
      - name: Ensure monitored branch exists
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          & git check-ref-format --branch $env:WATCH_BRANCH *> $null
          if ($LASTEXITCODE -ne 0) {
              throw "Invalid monitored branch: $env:WATCH_BRANCH"
          }

          $encodedBranch = [Uri]::EscapeDataString($env:WATCH_BRANCH)
          & gh api `
              "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$encodedBranch" `
              --silent *> $null
          $lookupExitCode = $LASTEXITCODE

          if ($lookupExitCode -eq 0) {
              Write-Host "Monitored branch exists: $env:WATCH_BRANCH"
              exit 0
          }

          $encodedControl = [Uri]::EscapeDataString($env:CONTROL_BRANCH)
          $defaultSha = (
              & gh api `
                  "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$encodedControl" `
                  --jq '.object.sha'
          ).Trim()

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($defaultSha)) {
              throw "Could not resolve default branch $env:CONTROL_BRANCH."
          }

          Write-Warning (
              "Monitored branch $env:WATCH_BRANCH is missing. " +
              "Creating it from $env:CONTROL_BRANCH at $defaultSha."
          )

          & gh api `
              --method POST `
              "repos/$env:GITHUB_REPOSITORY/git/refs" `
              -f "ref=refs/heads/$env:WATCH_BRANCH" `
              -f "sha=$defaultSha" `
              --silent *> $null
          $createExitCode = $LASTEXITCODE

          if ($createExitCode -ne 0) {
              # A concurrent run may have created the ref after our lookup.
              & gh api `
                  "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$encodedBranch" `
                  --silent *> $null

              if ($LASTEXITCODE -ne 0) {
                  throw (
                      "Could not create or resolve monitored branch " +
                      "$env:WATCH_BRANCH."
                  )
              }
          }

      # This is the independent checkout used by the assigned branch worker.
      - name: Check out monitored branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.WATCH_BRANCH }}
          path: repository
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          clean: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      # Each branch restores only its own most recent cache chain.
      - name: Restore branch-specific Cargo state
        id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            repository/target
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: |
            continuous-cargo-Windows-${{ env.WATCH_BRANCH }}-

      - name: Run continuous worker
        id: continuous-worker
        continue-on-error: true
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $repository = Join-Path $env:GITHUB_WORKSPACE 'repository'
          $watcher = Join-Path `
              $env:GITHUB_WORKSPACE `
              '.worker-control/scripts/watch-input-fixed.ps1'

          Set-Location -LiteralPath $repository

          & $watcher `
              -Branch $env:WATCH_BRANCH `
              -InputDirectory input `
              -OutputDirectory output `
              -PollSeconds 10 `
              -MaxRuntimeMinutes 320 `
              -MaximumCommandMinutes 60

          if ($LASTEXITCODE -ne 0) {
              Write-Warning (
                  "Watcher exited with code $LASTEXITCODE. " +
                  'The replacement stage will continue the branch chain.'
              )
              exit $LASTEXITCODE
          }

      # Dispatch before uploading the cache. The new run stays queued because
      # it uses the same per-branch concurrency group, then starts after this
      # run finishes and can restore the cache saved below.
      - name: Dispatch replacement for the same branch
        if: always()
        shell: pwsh
        env:
          WORKFLOW_FILE: continuous-worker.yml
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          & git check-ref-format --branch $env:WATCH_BRANCH *> $null
          if ($LASTEXITCODE -ne 0) {
              throw "Invalid monitored branch: $env:WATCH_BRANCH"
          }

          $repository = Join-Path $env:GITHUB_WORKSPACE 'repository'
          $sourceSha = ''

          if (Test-Path -LiteralPath (Join-Path $repository '.git')) {
              $sourceSha = (
                  & git -C $repository rev-parse --verify HEAD
              ).Trim()
          }

          if (
              $LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace($sourceSha)
          ) {
              $encodedControl = [Uri]::EscapeDataString(
                  $env:CONTROL_BRANCH
              )
              $sourceSha = (
                  & gh api `
                      "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$encodedControl" `
                      --jq '.object.sha'
              ).Trim()
          }

          if (
              $LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace($sourceSha)
          ) {
              throw 'Could not resolve a source commit for branch recovery.'
          }

          $encodedBranch = [Uri]::EscapeDataString($env:WATCH_BRANCH)
          & gh api `
              "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$encodedBranch" `
              --silent *> $null

          if ($LASTEXITCODE -ne 0) {
              Write-Warning (
                  "Remote branch $env:WATCH_BRANCH disappeared. " +
                  "Restoring it from $sourceSha."
              )

              & gh api `
                  --method POST `
                  "repos/$env:GITHUB_REPOSITORY/git/refs" `
                  -f "ref=refs/heads/$env:WATCH_BRANCH" `
                  -f "sha=$sourceSha" `
                  --silent *> $null

              if ($LASTEXITCODE -ne 0) {
                  & gh api `
                      "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$encodedBranch" `
                      --silent *> $null

                  if ($LASTEXITCODE -ne 0) {
                      throw (
                          "Could not restore monitored branch " +
                          "$env:WATCH_BRANCH."
                      )
                  }
              }
          }

          $stopReference = (
              "repos/$env:GITHUB_REPOSITORY/contents/" +
              '.continuous-worker.stop' +
              "?ref=$encodedBranch"
          )
          & gh api $stopReference --silent *> $null

          if ($LASTEXITCODE -eq 0) {
              Write-Host (
                  "Stop file found on $env:WATCH_BRANCH. " +
                  'No replacement will be dispatched.'
              )
              exit 0
          }

          for ($attempt = 1; $attempt -le 6; $attempt++) {
              & gh workflow run $env:WORKFLOW_FILE `
                  --repo $env:GITHUB_REPOSITORY `
                  --ref $env:CONTROL_BRANCH `
                  --raw-field "branch=$env:WATCH_BRANCH"
              $dispatchExitCode = $LASTEXITCODE

              if ($dispatchExitCode -eq 0) {
                  Write-Host (
                      'Replacement dispatched for branch ' +
                      "$env:WATCH_BRANCH."
                  )
                  exit 0
              }

              Write-Warning (
                  "Replacement dispatch attempt $attempt failed " +
                  "with exit code $dispatchExitCode."
              )
              Start-Sleep -Seconds ([Math]::Min(10 * $attempt, 60))
          }

          throw (
              'Could not dispatch a replacement for ' +
              "$env:WATCH_BRANCH after six attempts."
          )

      # Explicit save is used so Cargo state is uploaded even when the watcher
      # or replacement-dispatch step fails. The key is unique and immutable.
      - name: Save branch-specific Cargo state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            repository/target
          key: ${{ env.CARGO_CACHE_KEY }}
