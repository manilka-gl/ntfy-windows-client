name: Continuous Windows command worker
run-name: Continuous worker — ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to monitor
        required: true
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

# One active/pending chain per monitored branch.
# Different branches use different concurrency groups and run independently.
concurrency:
  group: continuous-windows-worker-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: windows-latest

    # GitHub-hosted jobs have a six-hour limit. The watcher stops earlier so
    # the replacement dispatch and cache post-step have time to finish.
    timeout-minutes: 350

    env:
      GH_TOKEN: ${{ github.token }}

      # Every monitored-repository fetch, checkout, rebase, and push uses
      # this branch explicitly.
      WATCH_BRANCH: ${{ inputs.branch }}

      # The workflow and watcher files are kept on the default branch.
      CONTROL_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out worker control files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .worker-control
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Check out monitored branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          path: repository
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Restore branch-specific Cargo build state
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            repository/target
          key: continuous-cargo-${{ runner.os }}-${{ inputs.branch }}-${{ github.run_id }}
          restore-keys: |
            continuous-cargo-${{ runner.os }}-${{ inputs.branch }}-

      - name: Run continuous worker
        shell: pwsh
        run: |
          Set-Location -LiteralPath (
              Join-Path $env:GITHUB_WORKSPACE 'repository'
          )

          $watcher = Join-Path `
              $env:GITHUB_WORKSPACE `
              '.worker-control/scripts/watch-input.ps1'

          & $watcher `
              -Branch $env:WATCH_BRANCH `
              -InputDirectory input `
              -OutputDirectory output `
              -PollSeconds 10 `
              -MaxRuntimeMinutes 320 `
              -MaximumCommandMinutes 60

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Dispatch replacement for the same branch
        if: always()
        shell: pwsh
        working-directory: repository
        env:
          WORKFLOW_FILE: continuous-worker.yml
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          & git check-ref-format --branch $env:WATCH_BRANCH *> $null

          if ($LASTEXITCODE -ne 0) {
              throw "Invalid monitored branch: $env:WATCH_BRANCH"
          }

          # Fetch only the branch assigned to this worker.
          $fetchRefSpec = (
              '+refs/heads/{0}:refs/remotes/origin/{0}' -f
              $env:WATCH_BRANCH
          )

          & git fetch --no-tags origin $fetchRefSpec

          if ($LASTEXITCODE -ne 0) {
              throw (
                  "Could not fetch monitored branch " +
                  "$env:WATCH_BRANCH."
              )
          }

          # Check the stop file only on the assigned branch.
          $stopReference = (
              'refs/remotes/origin/{0}:.continuous-worker.stop' -f
              $env:WATCH_BRANCH
          )

          & git cat-file -e $stopReference 2>$null

          if ($LASTEXITCODE -eq 0) {
              Write-Host (
                  "Stop file found on $env:WATCH_BRANCH. " +
                  'No replacement will be dispatched.'
              )
              exit 0
          }

          # The workflow definition is loaded from the default branch.
          # The input tells the new runner which branch it must monitor.
          & gh workflow run $env:WORKFLOW_FILE `
              --repo $env:GITHUB_REPOSITORY `
              --ref $env:CONTROL_BRANCH `
              --raw-field "branch=$env:WATCH_BRANCH"

          if ($LASTEXITCODE -ne 0) {
              throw (
                  "Could not dispatch replacement for " +
                  "$env:WATCH_BRANCH."
              )
          }

          Write-Host (
              "Replacement dispatched for branch " +
              "$env:WATCH_BRANCH."
          )
