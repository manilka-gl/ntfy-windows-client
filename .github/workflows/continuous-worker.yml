name: Continuous Windows command worker
run-name: >-
  Continuous worker — ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}

on:
  # Manual start. The workflow definition is loaded from the selected ref,
  # normally main, while the branch input identifies the branch to monitor.
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to monitor
        required: true
        type: string

  # Automatic start. Create or update this marker on any branch, including
  # main. The pushed branch itself becomes the monitored branch.
  push:
    branches:
      - '**'
    paths:
      - '.continuous-worker/start.txt'

# Input commands inherit the repository GITHUB_TOKEN with every available
# repository permission set to write. GitHub branch protection and organisation
# policy still apply, including when WATCH_BRANCH is main.
permissions: write-all

# One chain per monitored branch. Different branches run independently.
concurrency:
  group: >-
    continuous-windows-worker-${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: windows-latest

    # The hosted-runner limit is six hours. The watcher ends earlier so the
    # replacement dispatch and cache upload have time to complete.
    timeout-minutes: 350

    env:
      GH_TOKEN: ${{ github.token }}
      WATCH_BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
      CONTROL_BRANCH: ${{ github.event.repository.default_branch }}
      CARGO_CACHE_KEY: >-
        continuous-cargo-Windows-${{ github.event_name == 'push' && github.ref_name || inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # The workflow and watcher are controlled from the default branch.
      - name: Check out worker control files
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          path: .worker-control
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          clean: false
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      # This is the independent checkout used by the assigned branch worker.
      - name: Check out monitored branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.WATCH_BRANCH }}
          path: repository
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          clean: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      # Each branch restores only its own most recent cache chain.
      - name: Restore branch-specific Cargo state
        id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            repository/target
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: |
            continuous-cargo-Windows-${{ env.WATCH_BRANCH }}-

      - name: Run continuous worker
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $repository = Join-Path $env:GITHUB_WORKSPACE 'repository'
          $watcher = Join-Path `
              $env:GITHUB_WORKSPACE `
              '.worker-control/scripts/watch-input.ps1'

          Set-Location -LiteralPath $repository

          & $watcher `
              -Branch $env:WATCH_BRANCH `
              -InputDirectory input `
              -OutputDirectory output `
              -PollSeconds 10 `
              -MaxRuntimeMinutes 320 `
              -MaximumCommandMinutes 60

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      # Dispatch before uploading the cache. The new run stays queued because
      # it uses the same per-branch concurrency group, then starts after this
      # run finishes and can restore the cache saved below.
      - name: Dispatch replacement for the same branch
        if: always()
        shell: pwsh
        working-directory: repository
        env:
          WORKFLOW_FILE: continuous-worker.yml
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          & git check-ref-format --branch $env:WATCH_BRANCH *> $null

          if ($LASTEXITCODE -ne 0) {
              throw "Invalid monitored branch: $env:WATCH_BRANCH"
          }

          $fetchRefSpec = (
              '+refs/heads/{0}:refs/remotes/origin/{0}' -f
              $env:WATCH_BRANCH
          )

          & git fetch --no-tags origin $fetchRefSpec

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'Could not fetch monitored branch ' +
                  "$env:WATCH_BRANCH."
              )
          }

          $stopReference = (
              'refs/remotes/origin/{0}:.continuous-worker.stop' -f
              $env:WATCH_BRANCH
          )

          & git cat-file -e $stopReference 2>$null

          if ($LASTEXITCODE -eq 0) {
              Write-Host (
                  "Stop file found on $env:WATCH_BRANCH. " +
                  'No replacement will be dispatched.'
              )
              exit 0
          }

          # Replacement runs always load the workflow definition from the
          # default branch and continue monitoring the same WATCH_BRANCH.
          & gh workflow run $env:WORKFLOW_FILE `
              --repo $env:GITHUB_REPOSITORY `
              --ref $env:CONTROL_BRANCH `
              --raw-field "branch=$env:WATCH_BRANCH"

          if ($LASTEXITCODE -ne 0) {
              throw (
                  'Could not dispatch replacement for ' +
                  "$env:WATCH_BRANCH."
              )
          }

          Write-Host (
              'Replacement dispatched for branch ' +
              "$env:WATCH_BRANCH."
          )

      # Explicit save is used so Cargo state is uploaded even when the watcher
      # or replacement-dispatch step fails. The key is unique and immutable.
      - name: Save branch-specific Cargo state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            repository/target
          key: ${{ env.CARGO_CACHE_KEY }}
