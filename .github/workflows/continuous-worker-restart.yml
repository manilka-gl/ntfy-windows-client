name: Restart continuous Windows worker
run-name: Restart continuous worker

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  restart:
    if: github.event.issue.title == 'continuous-worker-restart'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.event.issue.body }}
    steps:
      - name: Cancel stale branch runs and dispatch replacement
        shell: bash
        run: |
          set -euo pipefail
          branch="${TARGET_BRANCH//$'\r'/}"
          git check-ref-format --branch "$branch" >/dev/null

          runs="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow continuous-worker.yml \
              --limit 50 \
              --json databaseId,status,displayTitle
          )"

          mapfile -t stale_ids < <(
            jq -r --arg branch "$branch" '
              .[]
              | select(.displayTitle | contains($branch))
              | select(
                  .status == "in_progress" or
                  .status == "pending" or
                  .status == "queued" or
                  .status == "waiting" or
                  .status == "requested"
                )
              | .databaseId
            ' <<<"$runs"
          )

          for run_id in "${stale_ids[@]}"; do
            echo "Cancelling stale worker run $run_id"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done

          gh workflow run continuous-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --raw-field "branch=$branch"

          gh issue close "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Cancelled ${#stale_ids[@]} stale run(s) and dispatched a replacement for \`$branch\`."
