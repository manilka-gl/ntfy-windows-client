name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, test, Clippy, and debug build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Debug build
        run: cargo build --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

  release-build:
    name: Release ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Build optimized executable
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ntfy-windows-client.exe" "dist/ntfy-windows-client-${{ matrix.target }}.exe"
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "ntfy-windows-client-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ntfy-windows-client-${{ matrix.target }}
          path: ntfy-windows-client-${{ matrix.target }}.zip
          if-no-files-found: error
