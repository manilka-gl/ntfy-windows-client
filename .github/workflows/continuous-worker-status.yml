name: Report continuous Windows worker status
run-name: Report worker status

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  report:
    if: github.event.issue.title == 'continuous-worker-status'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.event.issue.body }}
    steps:
      - name: Report matching runs
        shell: bash
        run: |
          set -u
          branch="${TARGET_BRANCH//$'\r'/}"
          runs="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow continuous-worker.yml \
              --limit 50 \
              --json databaseId,status,conclusion,event,createdAt,updatedAt,url,displayTitle,headSha \
              2>&1
          )"
          query_exit=$?

          if [[ $query_exit -eq 0 ]]; then
            match="$(
              jq -c --arg branch "$branch" '
                [
                  .[]
                  | select(.displayTitle | contains($branch))
                ][0:10]
              ' <<<"$runs"
            )"
          else
            match="$(
              jq -cn \
                --arg error "gh run list failed" \
                --arg output "$runs" \
                '{error: $error, output: $output}'
            )"
          fi

          gh issue close "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Matching run status:\n\n\`\`\`json\n${match}\n\`\`\`"
