name: Bootstrap source tree

on:
  push:
    branches: [feature/initial-client]
    paths: [.bootstrap/ready]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem .bootstrap/part* | Sort-Object Name
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('bootstrap.zip', [Convert]::FromBase64String($base64))
          New-Item -ItemType Directory -Force unpacked | Out-Null
          Expand-Archive bootstrap.zip unpacked -Force
          Get-ChildItem unpacked -Force | ForEach-Object { Copy-Item $_.FullName . -Recurse -Force }
          Remove-Item .bootstrap -Recurse -Force
          Remove-Item bootstrap.zip -Force
          Remove-Item unpacked -Recurse -Force
          Remove-Item .github/workflows/bootstrap.yml -Force
      - name: Commit source tree
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement lightweight Rust and Slint ntfy client"
          git push
