name: Bootstrap continuous Windows worker
run-name: Bootstrap worker — ${{ github.event.issue.body }}

on:
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: github.event.issue.title == 'continuous-worker-dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.event.issue.body }}
    steps:
      - name: Validate marker and dispatch monitored branch
        shell: bash
        run: |
          set -euo pipefail

          branch="${TARGET_BRANCH//$'\r'/}"
          if [[ -z "$branch" || "$branch" == *$'\n'* ]]; then
            echo 'Issue body must contain exactly one branch name.' >&2
            exit 2
          fi

          git check-ref-format --branch "$branch" >/dev/null

          gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/contents/.continuous-worker/start.txt" \
            -f "ref=$branch" \
            --silent >/dev/null

          gh workflow run continuous-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --raw-field "branch=$branch"

          gh issue close "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Continuous worker dispatched for \`$branch\`."
