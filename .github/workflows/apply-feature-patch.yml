name: Apply requested feature patch

on:
  pull_request:
    branches: [main]
    paths: [.patches/ready]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/initial-client'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/initial-client
      - name: Reconstruct and apply patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem .patches/part* | Sort-Object Name
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('requested.patch', [Convert]::FromBase64String($base64))
          git apply --index --whitespace=nowarn requested.patch
          Remove-Item .patches -Recurse -Force
          Remove-Item requested.patch -Force
      - name: Commit requested features
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add background notifications, placement, and sound"
          git push origin HEAD:feature/initial-client
