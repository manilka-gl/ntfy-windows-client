name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag to create or update, for example v0.1.0
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Test and Clippy
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo generate-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    needs: verify
    name: Build ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo generate-lockfile
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ntfy-windows-client.exe" "dist/ntfy-windows-client-${{ matrix.target }}.exe"
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "ntfy-windows-client-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ntfy-windows-client-${{ matrix.target }}
          path: ntfy-windows-client-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ntfy-windows-client-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" dist/*.zip --clobber
          } else {
            gh release create "$env:RELEASE_TAG" dist/*.zip --generate-notes
          }
