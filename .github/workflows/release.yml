name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag to create or update (for example v0.1.0)
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo generate-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo generate-lockfile
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ntfy-windows-client.exe" "dist/ntfy-windows-client-${{ matrix.target }}.exe"
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "ntfy-windows-client-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ntfy-windows-client-${{ matrix.target }}
          path: ntfy-windows-client-${{ matrix.target }}.zip
          if-no-files-found: error
      - name: Publish GitHub release asset
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ inputs.tag }}" "ntfy-windows-client-${{ matrix.target }}.zip" --clobber
          } else {
            gh release create "${{ inputs.tag }}" "ntfy-windows-client-${{ matrix.target }}.zip" --generate-notes
          }
